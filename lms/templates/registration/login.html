{% extends "lms/base.html" %}
{% block title %}Log in | SkillBoost LMS{% endblock %}
{% block content %}
    <h1>Log in</h1>
    {% if form.errors %}<p class="notice">Your username or password was incorrect.</p>{% endif %}
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit">Log in</button>
    </form>
{% endblock %}
