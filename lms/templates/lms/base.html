<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}SkillBoost LMS{% endblock %}</title>
    <style>
        body { font: 16px/1.5 system-ui, sans-serif; margin: 0 auto; max-width: 900px; padding: 1.5rem; color: #172033; }
        nav { display: flex; gap: 1rem; border-bottom: 1px solid #d5dbea; padding-bottom: 1rem; }
        a { color: #244b9b; }
        main { padding: 1rem 0; }
        label { display: block; font-weight: 600; margin-top: 1rem; }
        input, textarea { box-sizing: border-box; max-width: 100%; padding: .5rem; width: 100%; }
        textarea { min-height: 7rem; }
        button, .button { background: #244b9b; border: 0; border-radius: 4px; color: white; cursor: pointer; display: inline-block; margin: .5rem 0; padding: .65rem 1rem; text-decoration: none; }
        .message, .notice { background: #eef3ff; border-left: 4px solid #244b9b; margin: 1rem 0; padding: .75rem; }
        .card { border: 1px solid #d5dbea; border-radius: 6px; margin: 1rem 0; padding: 1rem; }
        .errorlist { color: #a32121; }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'lms:course_list' %}">SkillBoost LMS</a>
        <a href="{% url 'lms:course_upload' %}">Add course</a>
        {% if user.is_authenticated %}
            <a href="{% url 'lms:dashboard' %}">Dashboard</a>
            <span>{{ user.get_username }}</span>
            <form method="post" action="{% url 'logout' %}" style="margin-left:auto">
                {% csrf_token %}
                <button type="submit">Log out</button>
            </form>
        {% else %}
            <a href="{% url 'login' %}" style="margin-left:auto">Log in</a>
        {% endif %}
    </nav>
    {% if messages %}
        {% for message in messages %}
            <div class="message">{{ message }}</div>
        {% endfor %}
    {% endif %}
    <main>{% block content %}{% endblock %}</main>
</body>
</html>
